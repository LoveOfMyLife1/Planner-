<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d6f7a">
<link rel="manifest" href="manifest.json">
<title>Master Task Planner</title>
<style>
:root{--ink:#17212b;--muted:#687381;--line:#d9e0e7;--bg:#f4f7f9;--accent:#1d6f7a;--danger:#b42318;--shadow:0 12px 30px rgba(23,33,43,.08)}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);background:#fff;color:var(--ink);min-height:40px;padding:0 12px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.danger{color:var(--danger)}.icon{width:40px;padding:0;font-weight:800}input,select,textarea{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:8px 10px;min-height:40px;width:100%}textarea{resize:vertical;min-height:80px}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.topbar{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:18px;align-items:center;padding:16px 22px}h1{margin:0;font-size:24px}.subtitle,.sync-status,.helper{color:var(--muted);font-size:12px;line-height:1.4}.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.sync-status{flex-basis:100%;text-align:right}main{padding:18px 22px 28px;display:grid;gap:16px}.summary{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;min-height:76px;box-shadow:var(--shadow);text-align:left;display:block;cursor:pointer}.metric.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(29,111,122,.16),var(--shadow)}.metric span{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.metric strong{font-size:24px}.workspace{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.panel-header{padding:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}.panel-header h2{margin:0;font-size:16px}.form{padding:14px;display:grid;gap:11px}label{display:grid;gap:5px;color:var(--muted);font-size:12px;font-weight:650}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters{display:grid;grid-template-columns:minmax(180px,1.2fr) repeat(3,minmax(120px,.7fr)) auto;gap:8px;padding:12px;border-bottom:1px solid var(--line);align-items:center}.view-toggle{display:flex;gap:5px}.view-toggle .active{border-color:var(--accent);color:var(--accent)}.content{padding:12px}.task-list{display:grid;gap:8px}.task{border:1px solid var(--line);border-left-width:5px;border-radius:8px;background:#fff;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;padding:10px;align-items:start}.task[data-quadrant="1"]{border-left-color:#8f1d1d}.task[data-quadrant="2"]{border-left-color:#237347}.task[data-quadrant="3"]{border-left-color:#d19a00}.task[data-quadrant="4"]{border-left-color:#6f7782}.task[data-quadrant=""]{border-left-color:var(--accent)}.task.done{opacity:.72}.check{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;background:#f9fbfc;font-weight:800}.task h3{margin:0;font-size:15px;line-height:1.35;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.pill{border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted);background:#f7f9fb;font-size:12px}.overdue{color:#fff;border-color:var(--danger);background:var(--danger)}.quadrant-picker{width:auto;min-width:88px;min-height:28px;padding:3px 28px 3px 8px;border-radius:999px;font-size:12px;font-weight:650;cursor:pointer}.q1{color:#fff!important;border-color:#8f1d1d!important;background:#8f1d1d!important}.q2{color:#fff!important;border-color:#237347!important;background:#237347!important}.q3{color:#3b2a00!important;border-color:#d19a00!important;background:#ffd767!important}.q4{color:#fff!important;border-color:#6f7782!important;background:#6f7782!important}.inbox{color:#0f5660!important;border-color:#8ec0c7!important;background:#e4f2f4!important}.quadrant-picker option{color:var(--ink);background:#fff}.task p{margin:8px 0 0;color:#384554;line-height:1.4;font-size:13px;overflow-wrap:anywhere}.task-actions{display:flex;gap:6px}.quadrants{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.quadrant{border:1px solid var(--line);border-radius:8px;min-height:180px;overflow:hidden;background:#fbfcfd}.quadrant h3{margin:0;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px;background:#fff}.quadrant .task-list{padding:10px}.empty{border:1px dashed #b9c4cf;border-radius:8px;padding:24px;color:var(--muted);text-align:center;background:#fbfcfd}.hidden{display:none!important}dialog{border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);width:min(560px,calc(100vw - 28px));padding:0}dialog::backdrop{background:rgba(23,33,43,.32)}.modal-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding-top:4px}@media(max-width:1050px){.workspace{grid-template-columns:1fr}.planner{order:1}.editor{order:2}.summary{grid-template-columns:repeat(3,minmax(120px,1fr))}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.topbar{grid-template-columns:1fr}.actions{justify-content:start}.sync-status{text-align:left}button,input,select,textarea{min-height:44px}main{padding:12px}.summary,.quadrants,.two{grid-template-columns:1fr}.task{grid-template-columns:36px minmax(0,1fr)}.task-actions{grid-column:2}.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><header><div class="topbar"><div><h1>Master Task Planner</h1><div class="subtitle">Covey quadrant planner with role, due date, notes, and clear sync.</div></div><div class="actions"><input id="fileInput" class="hidden" type="file" accept=".csv,text/csv"><button id="pullBtn">Pull</button><button id="pushBtn">Push</button><button id="syncBtn">Sync</button><button id="importBtn">Import</button><button id="exportBtn">Export</button><button id="resetBtn" class="danger">Reset</button><div id="syncStatus" class="sync-status">Sync not configured</div></div></div></header>
<dialog id="syncDialog"><div class="panel-header"><h2>Sync Settings</h2><button id="syncClose" class="icon" type="button">x</button></div><form id="syncForm" class="form"><label>Sync URL<input id="syncUrl" type="url" placeholder="https://mantledb.sh/v2/.../tasks"></label><label>Sync key<input id="syncKey" type="password" placeholder="Private sync key"></label><p class="helper">The OneNote link can configure this automatically. Use Pull to load cloud tasks and Push to save local edits.</p><label><input id="autoSync" type="checkbox"> Auto-sync every 30 seconds while open</label><div class="modal-actions"><button id="clearSync" class="danger" type="button">Clear</button><button class="primary" type="submit">Save Settings</button></div></form></dialog>
<main><section class="summary"><button class="metric active" data-qf="all"><span>Total tasks</span><strong id="totalCount">0</strong></button><button class="metric" data-qf="1"><span>Q1</span><strong id="q1Count">0</strong></button><button class="metric" data-qf="2"><span>Q2</span><strong id="q2Count">0</strong></button><button class="metric" data-qf="3"><span>Q3</span><strong id="q3Count">0</strong></button><button class="metric" data-qf="4"><span>Q4</span><strong id="q4Count">0</strong></button></section><section class="workspace"><aside class="panel editor"><div class="panel-header"><h2 id="formTitle">Add Task</h2><button id="clearForm" class="icon" type="button">+</button></div><form id="taskForm" class="form"><input id="editingId" type="hidden"><label>Task<textarea id="taskText" required placeholder="What needs attention?"></textarea></label><div class="two"><label>Check<select id="check"><option value="-">- Not done</option><option value="?">? Needs review</option><option value="x">x Done</option></select></label><label>Quadrant<select id="quadrant"><option value="">Inbox</option><option value="1">Q1</option><option value="2">Q2</option><option value="3">Q3</option><option value="4">Q4</option></select></label></div><div class="two"><label>Role<select id="role"><option value="">None</option><option>Personal</option><option>Home and family</option><option>Elders quorum</option><option>Church assignment</option></select></label><label>Due<input id="due" type="date"></label></div><label>Notes<textarea id="notes"></textarea></label><button class="primary" type="submit">Save Task</button></form></aside><section class="panel planner"><div class="filters"><input id="search" type="search" placeholder="Search tasks, notes, or role"><select id="roleFilter"><option value="">All roles</option><option>Personal</option><option>Home and family</option><option>Elders quorum</option><option>Church assignment</option></select><select id="quadrantFilter"><option value="">All quadrants</option><option value="inbox">Inbox</option><option value="1">Quadrant 1</option><option value="2">Quadrant 2</option><option value="3">Quadrant 3</option><option value="4">Quadrant 4</option></select><select id="sortMode"><option value="planner">Planner order</option><option value="due">Due date</option><option value="role">Role</option><option value="quadrant">Quadrant</option></select><div class="view-toggle"><button id="listView" class="active" type="button">List</button><button id="gridView" type="button">Grid</button></div></div><div id="content" class="content"></div></section></section></main></div>
<script>
const STORAGE='master-task-planner-v1', META='master-task-planner-meta-v1', SYNC='master-task-planner-sync-v2', TODAY=new Date().toLocaleDateString('en-CA');
const ROLES=['Personal','Home and family','Elders quorum','Church assignment'];
let tasks=loadTasks().map(normalizeTask), view='list', quick='all', sync=loadSync(), syncing=false, syncTimer=null, pushTimer=null;
const $=id=>document.getElementById(id), els={content:$('content'),form:$('taskForm'),editingId:$('editingId'),taskText:$('taskText'),check:$('check'),quadrant:$('quadrant'),role:$('role'),due:$('due'),notes:$('notes'),search:$('search'),roleFilter:$('roleFilter'),quadrantFilter:$('quadrantFilter'),sortMode:$('sortMode'),syncStatus:$('syncStatus'),syncDialog:$('syncDialog'),syncUrl:$('syncUrl'),syncKey:$('syncKey'),autoSync:$('autoSync')};
function loadTasks(){try{return JSON.parse(localStorage.getItem(STORAGE)||'[]')}catch{return[]}}function saveTasks(o={}){localStorage.setItem(STORAGE,JSON.stringify(tasks.map(normalizeTask)));if(o.dirty!==false){let m=loadMeta();m.localUpdatedAt=new Date().toISOString();m.dirty=true;saveMeta(m);queuePush()}syncStatus()}function loadMeta(){try{return JSON.parse(localStorage.getItem(META)||'{"localUpdatedAt":"","remoteUpdatedAt":"","dirty":false}')}catch{return{localUpdatedAt:'',remoteUpdatedAt:'',dirty:false}}}function saveMeta(m){localStorage.setItem(META,JSON.stringify(m))}function loadSync(){try{return JSON.parse(localStorage.getItem(SYNC)||'{"url":"","key":"","auto":false}')}catch{return{url:'',key:'',auto:false}}}function saveSync(){localStorage.setItem(SYNC,JSON.stringify(sync));syncStatus();autoSync()}
function mapRole(v){v=String(v||'').trim();if(ROLES.includes(v))return v;let s=v.toLowerCase();if(!s)return'';if(s.includes('home')||s.includes('family'))return'Home and family';if(s.includes('elder'))return'Elders quorum';if(s.includes('church')||s.includes('mission')||s.includes('assignment'))return'Church assignment';if(s.includes('personal'))return'Personal';return''}function normalizeTask(t={},i=0){return{id:t.id||(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+i),order:Number.isFinite(+t.order)?+t.order:i,check:t.check=='x'||t.status=='Done'?'x':t.check=='?'?'?':'-',task:String(t.task||''),quadrant:['1','2','3','4'].includes(String(t.quadrant||''))?String(t.quadrant):'',role:mapRole(t.role||t.context),due:t.due||'',notes:t.notes||''}}
function applyLinkSync(){let h=new URLSearchParams(location.hash.replace(/^#/,'')),q=new URLSearchParams(location.search);let u=h.get('syncUrl')||q.get('syncUrl'),k=h.get('syncKey')||q.get('syncKey'),a=h.get('auto')||q.get('auto');if(u&&k){sync={url:u,key:k,auto:a==='1'};saveSync();history.replaceState(null,'',location.pathname);return true}return false}
function parseCsv(t){let rows=[],row=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(c=='"'&&q&&n=='"'){v+='"';i++}else if(c=='"')q=!q;else if(c==','&&!q){row.push(v);v=''}else if((c=='\n'||c=='\r')&&!q){if(c=='\r'&&n=='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows}function parseNotes(n){let d={};String(n||'').split('|').forEach(p=>{let m=p.trim().match(/^([^:]+):\s*(.*)$/);if(m)d[m[1].trim()]=m[2].trim()});return d}function csvToTasks(t){let rows=parseCsv(t),heads=(rows.shift()||[]).map(h=>h.trim());return rows.map((r,i)=>{let rec=Object.fromEntries(heads.map((h,j)=>[h,r[j]||''])),p=parseNotes(rec.Notes||'');return normalizeTask({order:i,check:rec['Check Mark']=='?'?'?':rec['Check Mark']=='x'?'x':'-',task:rec.Task||'',quadrant:rec.Quadrant||'',role:p.Role||p.Context,due:p.Due||'',notes:p.Notes||''},i)}).filter(t=>t.task.trim())}
function checkText(v){return v=='x'?'✓':v=='?'?'?':'-'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function qc(t){return t.quadrant?'q'+t.quadrant:'inbox'}
function filtered(){let term=els.search.value.trim().toLowerCase(),role=els.roleFilter.value,q=quick!='all'?quick:els.quadrantFilter.value;return tasks.filter(t=>{let h=[t.task,t.notes,t.role].join(' ').toLowerCase();if(term&&!h.includes(term))return false;if(role&&t.role!=role)return false;if(q=='inbox'&&t.quadrant)return false;if(q&&q!='inbox'&&t.quadrant!=q)return false;return true}).sort((a,b)=>els.sortMode.value=='due'?(a.due||'9999').localeCompare(b.due||'9999'):els.sortMode.value=='role'?(a.role||'').localeCompare(b.role||''):els.sortMode.value=='quadrant'?(a.quadrant||'9').localeCompare(b.quadrant||'9'):a.order-b.order)}
function render(){metrics();let items=filtered();els.content.innerHTML='';if(view=='grid')grid(items);else{let list=document.createElement('div');list.className='task-list';items.forEach(t=>list.appendChild(card(t)));els.content.appendChild(items.length?list:empty())}}function metrics(){$('totalCount').textContent=tasks.length;['1','2','3','4'].forEach(q=>$(q=='1'?'q1Count':q=='2'?'q2Count':q=='3'?'q3Count':'q4Count').textContent=tasks.filter(t=>t.quadrant==q).length);document.querySelectorAll('.metric').forEach(b=>b.classList.toggle('active',b.dataset.qf==quick))}
function card(t){let a=document.createElement('article'),over=t.due&&t.due<TODAY&&t.check!='x';a.className='task'+(t.check=='x'?' done':'');a.dataset.quadrant=t.quadrant;a.innerHTML=`<button class="check">${checkText(t.check)}</button><div><h3>${esc(t.task)}</h3><div class="meta"><select class="quadrant-picker ${qc(t)}"><option value="" ${t.quadrant==''?'selected':''}>Inbox</option><option value="1" ${t.quadrant=='1'?'selected':''}>Q1</option><option value="2" ${t.quadrant=='2'?'selected':''}>Q2</option><option value="3" ${t.quadrant=='3'?'selected':''}>Q3</option><option value="4" ${t.quadrant=='4'?'selected':''}>Q4</option></select>${t.role?`<span class="pill">${esc(t.role)}</span>`:''}${t.due?`<span class="pill ${over?'overdue':''}">Due ${esc(t.due)}</span>`:''}</div>${t.notes?`<p>${esc(t.notes)}</p>`:''}</div><div class="task-actions"><button class="icon edit">E</button><button class="icon danger delete">D</button></div>`;a.querySelector('.check').onclick=()=>toggle(t.id);a.querySelector('.quadrant-picker').onchange=e=>{t.quadrant=e.target.value;saveTasks();render()};a.querySelector('.edit').onclick=()=>fill(t);a.querySelector('.delete').onclick=()=>{if(confirm('Delete this task?')){tasks=tasks.filter(x=>x.id!=t.id);saveTasks();render()}};return a}function empty(s='No tasks match the current filters.'){let d=document.createElement('div');d.className='empty';d.textContent=s;return d}function grid(items){let wrap=document.createElement('div');wrap.className='quadrants';[['1','Quadrant 1'],['2','Quadrant 2'],['3','Quadrant 3'],['4','Quadrant 4'],['','Inbox']].forEach(([k,l])=>{let p=document.createElement('section');p.className='quadrant';p.innerHTML=`<h3>${l}</h3>`;let list=document.createElement('div');list.className='task-list';items.filter(t=>t.quadrant==k).forEach(t=>list.appendChild(card(t)));if(!list.children.length)list.appendChild(empty('No tasks here.'));p.appendChild(list);wrap.appendChild(p)});els.content.appendChild(wrap)}
function read(){let old=tasks.find(t=>t.id==els.editingId.value);return normalizeTask({id:els.editingId.value,order:old?old.order:tasks.length,task:els.taskText.value.trim(),check:els.check.value,quadrant:els.quadrant.value,role:els.role.value,due:els.due.value,notes:els.notes.value.trim()})}function fill(t){$('formTitle').textContent=t?'Edit Task':'Add Task';els.editingId.value=t?t.id:'';els.taskText.value=t?t.task:'';els.check.value=t?t.check:'-';els.quadrant.value=t?t.quadrant:'';els.role.value=t?t.role:'';els.due.value=t?t.due:'';els.notes.value=t?t.notes:''}function toggle(id){let t=tasks.find(x=>x.id==id);if(!t)return;t.check=t.check=='-'?'?':t.check=='?'?'x':'-';saveTasks();render()}
function noteField(t){return[t.role&&`Role: ${t.role}`,t.due&&`Due: ${t.due}`,t.notes&&`Notes: ${t.notes}`].filter(Boolean).join(' | ')}function csvVal(v){v=String(v||'');return/[",\r\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}function exportCsv(){let rows=[['Quadrant','Check Mark','Task','Notes']];[...tasks].sort((a,b)=>a.order-b.order).forEach(t=>rows.push([t.quadrant,checkText(t.check),t.task,noteField(t)]));let blob=new Blob([rows.map(r=>r.map(csvVal).join(',')).join('\r\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Master Task List(Daily Planner).csv';a.click();URL.revokeObjectURL(a.href)}
function isMantle(){return sync.url.includes('mantledb.sh/')}function headers(){let h={'Content-Type':'application/json'};if(sync.key)h[isMantle()?'X-Mantle-Key':'X-Sync-Key']=sync.key;return h}function writeMethod(){return isMantle()?'POST':'PUT'}function payload(){return{app:'master-task-planner',version:2,updatedAt:new Date().toISOString(),tasks:tasks.map(normalizeTask)}}function norm(p){if(Array.isArray(p))return{tasks:p.map(normalizeTask),updatedAt:''};if(p&&Array.isArray(p.tasks))return{...p,tasks:p.tasks.map(normalizeTask)};throw Error('Sync data did not include a tasks array.')}function syncStatus(msg){if(msg){els.syncStatus.textContent=msg;return}let m=loadMeta();els.syncStatus.textContent=!sync.url?'Sync not configured':m.dirty?'Local changes not pushed':m.remoteUpdatedAt?'Synced '+new Date(m.remoteUpdatedAt).toLocaleString():sync.auto?'Sync ready, auto on':'Sync ready'}async function pull(force=false){if(!sync.url)return openSync();if(syncing)return;syncing=true;syncStatus('Pulling...');try{let r=await fetch(sync.url,{headers:headers()});if(!r.ok)throw Error('Pull failed: '+r.status);let txt=await r.text();if(!txt||txt=='null'){syncStatus('No cloud tasks yet. Use Push.');return}let remote=norm(JSON.parse(txt)),m=loadMeta();if(m.dirty&&!force&&!confirm('Replace local unsynced changes with cloud tasks?')){syncStatus();return}tasks=remote.tasks;localStorage.setItem(STORAGE,JSON.stringify(tasks));saveMeta({localUpdatedAt:remote.updatedAt||new Date().toISOString(),remoteUpdatedAt:remote.updatedAt||'',dirty:false});fill();render();syncStatus('Pulled latest tasks.')}catch(e){syncStatus(e.message||'Pull failed.')}finally{syncing=false}}async function push(){if(!sync.url)return openSync();if(syncing)return;syncing=true;syncStatus('Pushing...');try{let p=payload(),r=await fetch(sync.url,{method:writeMethod(),headers:headers(),body:JSON.stringify(p)});if(!r.ok)throw Error('Push failed: '+r.status);tasks=p.tasks;localStorage.setItem(STORAGE,JSON.stringify(tasks));saveMeta({localUpdatedAt:p.updatedAt,remoteUpdatedAt:p.updatedAt,dirty:false});syncStatus('Pushed latest tasks.')}catch(e){syncStatus(e.message||'Push failed.')}finally{syncing=false}}function queuePush(){if(!sync.auto||!sync.url)return;clearTimeout(pushTimer);pushTimer=setTimeout(push,1200)}function autoSync(){clearInterval(syncTimer);if(sync.auto&&sync.url)syncTimer=setInterval(()=>loadMeta().dirty?push():pull(true),30000)}function openSync(){els.syncUrl.value=sync.url||'';els.syncKey.value=sync.key||'';els.autoSync.checked=!!sync.auto;els.syncDialog.showModal?els.syncDialog.showModal():els.syncDialog.setAttribute('open','')}
els.form.onsubmit=e=>{e.preventDefault();let n=read();if(!n.task)return;let i=tasks.findIndex(t=>t.id==n.id);if(i>=0)tasks[i]=n;else tasks.push(n);fill();saveTasks();render()};$('clearForm').onclick=()=>fill();$('importBtn').onclick=()=>$('fileInput').click();$('exportBtn').onclick=exportCsv;$('resetBtn').onclick=()=>{if(confirm('Clear local tasks?')){tasks=[];saveTasks();fill();render()}};$('fileInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{tasks=csvToTasks(r.result);saveTasks();fill();render();e.target.value=''};r.readAsText(f,'windows-1252')};$('syncBtn').onclick=openSync;$('pullBtn').onclick=()=>pull();$('pushBtn').onclick=push;$('syncClose').onclick=()=>els.syncDialog.close();$('clearSync').onclick=()=>{sync={url:'',key:'',auto:false};localStorage.removeItem(SYNC);autoSync();syncStatus();els.syncDialog.close()};$('syncForm').onsubmit=e=>{e.preventDefault();sync={url:els.syncUrl.value.trim(),key:els.syncKey.value,auto:els.autoSync.checked};saveSync();els.syncDialog.close()};[els.search,els.roleFilter,els.quadrantFilter,els.sortMode].forEach(el=>{el.oninput=el.onchange=()=>{quick='all';render()}});document.querySelectorAll('.metric').forEach(b=>b.onclick=()=>{quick=b.dataset.qf;els.search.value='';els.roleFilter.value='';els.quadrantFilter.value=quick=='all'?'':quick;render()});$('listView').onclick=()=>{view='list';$('listView').classList.add('active');$('gridView').classList.remove('active');render()};$('gridView').onclick=()=>{view='grid';$('gridView').classList.add('active');$('listView').classList.remove('active');render()};const hadSync=applyLinkSync();if(JSON.stringify(tasks)!==localStorage.getItem(STORAGE))localStorage.setItem(STORAGE,JSON.stringify(tasks));render();syncStatus();autoSync();if(hadSync||(!tasks.length&&sync.url))pull(true);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script>
</body>
</html>
